<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<title>Crear Planeación</title>
<link rel="stylesheet" href="style.css">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body class="panel-body">

<!-- SIDEBAR -->
<div class="sidebar">

<div class="logo-panel">
<img src="img/tesji.png">
<h3>SISTEMA DE PLANEACIÓN ACADÉMICA</h3>
</div>

<div class="admin-info">
<div class="admin-info-box">

<img id="fotoDocenteSidebar"
src="img/perfiles/default.png">

<p id="nombreDocenteSidebar">Docente</p>

<span id="rolDocenteSidebar">Docente</span>

</div>
</div>

<ul>
<li><a href="dashboard.html">🏠 Menú</a></li>
<li><a href="crear_planeacion.html" class="active">✏️ Crear Planeación</a></li>
<li><a href="ver_planeaciones.html">📄 Ver Planeaciones</a></li>
<li><a href="horarios.html">⏰ Horarios</a></li>
<li><a href="perfil.html">👤 Mi Perfil</a></li>
<li><a href="login.html">🚪 Cerrar Sesión</a></li>
</ul>

</div>

<!-- CONTENIDO -->
<div class="contenido">

<h1 class="titulo">Crear Planeación</h1>

<div class="form-container">

<form class="form-planeacion" id="formPlaneacion" enctype="multipart/form-data">

<div class="campo">
    <label>Periodo</label>
    <input
        type="text"
        name="periodo"
        id="periodo"
        placeholder="Ej: 2026-1">
</div>

<div class="campo">
    <label>Carrera</label>

    <select name="carrera" id="carrera" required>

        <option value="">Seleccione una carrera</option>
          <option value="Ingeniería Industrial">
            Ingeniería Industrial
        </option>

          <option value="Ingeniería en Sistemas Computacionales">
            Ingeniería en Sistemas Computacionales
        </option>

        <option value="Ingeniería Mecatrónica">
            Ingeniería Mecatrónica
        </option>

        <option value="Ingeniería Civil">
            Ingeniería Civil
        </option>

        <option value="Ingeniería Química">
            Ingeniería Química
        </option>

        <option value="Ingeniería en Logística">
            Ingeniería en Logística
        </option>

        <option value="Ingeniería en Tecnologías de la Información y Comunicaciones">
            Ingeniería en Tecnologías de la Información y Comunicaciones
        </option>

        <option value="Licenciatura en Administración">
            Licenciatura en Administración
        </option>

    </select>
</div>

<div class="campo">
<label>Grupo</label>
<input type="text" name="grupo" id="grupo">
</div>

<div class="campo">
<label>Materia</label>
<input type="text" name="materia" id="materia">
</div>

<div class="campo">
    <label>Fecha</label>
    <input
        type="date"
        name="fecha"
        id="fecha"
        readonly>
</div>

<div class="campo">
    <label>Archivo</label>

   <button type="button" class="btn-archivo" onclick="seleccionarArchivo()">
    📄 Seleccionar
</button>

<small class="texto-pdf">
    Solo se permiten archivos PDF.
</small>

<input
    type="file"
    name="archivo"
    id="archivo"
    accept=".pdf"
    style="display:none">

<p id="nombreArchivo"></p>

<div class="campo campo-full botones-formulario">
    <button type="submit" class="btn-guardar">
        <i class="fa-solid fa-floppy-disk"></i>
        Guardar Planeación
    </button>
</div>

</form>

</div>

</div>

<script>


const API = window.location.origin;

// 🔥 FECHA AUTOMÁTICA
function colocarFechaActual() {

    const hoy = new Date();

    const año = hoy.getFullYear();
    const mes = String(hoy.getMonth() + 1).padStart(2, "0");
    const dia = String(hoy.getDate()).padStart(2, "0");

    document.getElementById("fecha").value = `${año}-${mes}-${dia}`;
}

// Colocar la fecha al abrir la página
colocarFechaActual();

// 🔥 USUARIO
const usuario = JSON.parse(localStorage.getItem("usuario"));

console.log("USUARIO LOGIN:", usuario);

if(!usuario || usuario.tipo !== "docente"){
alert("Acceso solo docentes");
window.location = "login.html";
}

// 🔥 ARCHIVO
function seleccionarArchivo(){
document.getElementById("archivo").click();
}

document.getElementById("archivo").addEventListener("change", function(){
if(this.files[0]){
document.getElementById("nombreArchivo").innerText =
"📄 " + this.files[0].name;
}
});

// 🔥 GUARDAR
document.getElementById("formPlaneacion").addEventListener("submit", function(e){
e.preventDefault();

const formData = new FormData(this);
formData.append("id_usuario", usuario.id);

fetch(`${API}/guardar-planeacion`, {
method: "POST",
body: formData
})
.then(res => res.json())
.then(data => {

console.log("RESPUESTA BACKEND:", data);

if(data.status === "ok"){

    alert("✅ Planeación guardada correctamente.");

    this.reset();

    // 🔥 Volver a colocar la fecha automáticamente
    colocarFechaActual();

    // Limpiar el nombre del archivo
    document.getElementById("nombreArchivo").innerText = "";

    // Ir a la página de planeaciones
    window.location.href = "ver_planeaciones.html";

}else{
    alert("❌ Error al guardar la planeación.");
}
})
.catch(err => {
console.log("ERROR FETCH:", err);
alert("❌ Error de conexión");
});

});

// PERFIL
const datosPerfil =
JSON.parse(localStorage.getItem("perfil_" + usuario.id));

if(datosPerfil){
document.getElementById("nombreDocenteSidebar").innerText =
datosPerfil.nombre || "Docente";
}

// FOTO
const fotoGuardada =
localStorage.getItem("fotoPerfil_" + usuario.id);

if(fotoGuardada && fotoGuardada !== "null" && fotoGuardada !== "undefined"){
document.getElementById("fotoDocenteSidebar").src = fotoGuardada;
}

</script>

<a href="dashboard.html" class="btn-menu">🏠 Menú</a>

</body>
</html>
