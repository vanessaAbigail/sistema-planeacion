<!-- 🔥 CONTENIDO -->
<div class="contenido">

<h1 class="titulo">
Grupos / Asignaturas
</h1>



<div class="contenedor">

<!-- 🔥 BARRA SUPERIOR -->
<div class="filtro-box">

<!-- 🔍 BUSCADOR -->
<div class="busqueda-box">

<input
type="text"
id="buscador"
placeholder="🔍 Buscar materia, docente o grupo..."
onkeyup="mostrar()"
>

</div>

<!-- 🔥 CONTADOR -->
<div class="contador-box">

<span id="totalCards">
0
</span>

Grupos

</div>

</div>

<!-- 🔥 CARDS -->
<div class="cards" id="lista">

</div>

</div>

</div>

<script>

// 🔥 ADMIN ID
const adminId = "admin";

// 🔥 CARGAR DATOS ADMIN

window.onload = function(){

// 🔥 NOMBRE
const datos =
JSON.parse(
localStorage.getItem(
"perfil_admin_" + adminId
)
);

if(datos){

document.getElementById("nombreAdmin").innerText =
datos.nombre || "Administrador";

}

// 🔥 FOTO
const foto =
localStorage.getItem(
"foto_admin_" + adminId
);

if(foto){

document.getElementById(
"fotoAdminSidebar"
).src = foto;

}

// 🔥 MOSTRAR CARDS
mostrar();

}

// 🔥 CERRAR SESIÓN
function cerrarSesion(){

localStorage.removeItem("usuario");

window.location = "login.html";

}

// 🔥 MOSTRAR GRUPOS AUTOMÁTICOS

function mostrar(){

let lista =
document.getElementById("lista");

let texto =
document.getElementById("buscador")
.value
.toLowerCase();

fetch("http://localhost:3000/grupos")

.then(res => res.json())

.then(datos => {

lista.innerHTML = "";

// 🔥 BUSCADOR
let filtrados = datos.filter(d =>

d.materia.toLowerCase().includes(texto)

||

d.docente.toLowerCase().includes(texto)

||

d.grupo.toLowerCase().includes(texto)

);

// 🔥 CONTADOR
document.getElementById("totalCards")
.innerText = filtrados.length;

// 🔥 MOSTRAR CARDS
filtrados.forEach(d => {

lista.innerHTML += `

<div class="card">

<div class="icono">
📚
</div>

<h3>
${d.grupo}
</h3>

<p>
<b>Materia:</b>
${d.materia}
</p>

<p>
<b>Docente:</b>
${d.docente}
</p>

<p>
<b>Carrera:</b>
${d.carrera}
</p>

</div>

`;

});

});

}

</script>
<a href="dashboard_admin.html" class="btn-menu">
🏠 Menú
</a>
</body>
