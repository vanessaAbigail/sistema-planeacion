<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<title>Horarios</title>
<link rel="stylesheet" href="style.css">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body class="panel-body">

<!-- SIDEBAR -->
<div class="sidebar">

<div class="logo-panel">
<img src="img/logo.jpg">
<h3>SISTEMA DE PLANEACIÓN ACADÉMICA</h3>
</div>
<div class="admin-info">
<div class="admin-info-box">

<img id="fotoDocenteSidebar"
src="img/perfiles/default.png">

<p id="nombreDocenteSidebar">
Docente
</p>

<span id="rolDocenteSidebar">
Docente
</span>

</div>
</div>

<ul>
<li><a href="dashboard.html">🏠 Menú</a></li>
<li><a href="crear_planeacion.html">✏️ Crear Planeación</a></li>
<li><a href="ver_planeaciones.html">📄 Ver Planeaciones</a></li>
<li><a href="horarios.html" class="active">⏰ Horarios</a></li>
<li><a href="perfil.html">👤 Mi Perfil</a></li>
<li><a href="login.html">🚪 Cerrar Sesión</a></li>
</ul>

</div>

<!-- CONTENIDO -->
<div class="contenido">

<h1 class="titulo">Horarios</h1>

<!-- PANEL USUARIO -->
<div class="user-panel" onclick="toggleMenu()">
</div>

<!-- MENÚ -->
<div id="menuUsuario" class="menu-usuario">
<a href="perfil.html">👤 Ver perfil</a>
<a href="editar_perfil.html">✏️ Editar perfil</a>
<a href="login.html">🚪 Cerrar sesión</a>
</div>

<!-- CONTENIDO -->
<div class="horizontal-layout">
<div class="periodo-box">

<label>Periodo:</label>

<input
type="text"
id="periodoInput"
placeholder="Ej: 2026-1"
onkeyup="cargarClases()"
>

<a href="agregar_clase.html">
<button class="btn-principal">
Agregar Clase
</button>
</a>

</div>

<div class="horarios-container">

<table class="tabla-horarios">

<thead>
<tr>
<th>Hora</th>
<th>Lunes</th>
<th>Martes</th>
<th>Miércoles</th>
<th>Jueves</th>
<th>Viernes</th>
</tr>
</thead>

<tbody id="tablaHorario"></tbody>

</table>

</div>

</div>



<script>

// 🔒 PROTEGER DOCENTE
const rol = localStorage.getItem("rol");

if(rol !== "docente"){

alert("⚠️ No tienes acceso a esta sección");

window.location = "login.html";

}

// 🔥 USUARIO ACTUAL
const usuario = JSON.parse(localStorage.getItem("usuario"));

console.log("USUARIO:", usuario);

// 🔥 CARGAR HORARIOS
function cargarClases(){

fetch("http://localhost:3000/horarios/" + usuario.id)

.then(res => res.json())

.then(clases => {

console.log("HORARIOS:", clases);

let tabla = document.getElementById("tablaHorario");

tabla.innerHTML = "";

// 🔍 FILTRO POR PERIODO
let periodoBuscado = document
.getElementById("periodoInput")
.value
.toLowerCase()
.trim();

if(periodoBuscado !== ""){

clases = clases.filter(c =>

(c.periodo || "")
.toLowerCase()
.includes(periodoBuscado)

);

}

// 🔥 HORAS ÚNICAS
let horas = [...new Set(clases.map(c => c.hora))];

if(horas.length === 0){

tabla.innerHTML = `
<tr>
<td colspan="6">
No hay clases registradas
</td>
</tr>
`;

return;

}

// 🔥 CREAR FILAS
horas.forEach(hora => {

tabla.innerHTML += `
<tr>
<td>${hora}</td>
<td></td>
<td></td>
<td></td>
<td></td>
<td></td>
</tr>
`;

});

// 🔥 INSERTAR CLASES
let filas = document.querySelectorAll("#tablaHorario tr");

clases.forEach((c) => {

filas.forEach(fila => {

if(fila.children[0].innerText.trim() === c.hora.trim()){

let dias = {

"Lunes": 1,
"Martes": 2,
"Miércoles": 3,
"Miercoles": 3,
"Jueves": 4,
"Viernes": 5

};

let posicion = dias[c.dia];

if(posicion){

let celda = fila.children[posicion];

celda.innerHTML = `

<div style="
background:white;
padding:12px;
border-radius:12px;
color:#333;
font-weight:bold;
text-align:center;
border-left:4px solid #343a40;
box-shadow:0 2px 6px rgba(0,0,0,.08);
">

${c.materia}<br>

<small>${c.grupo}</small><br>

<small>${c.carrera || ""}</small>

<br><br>

<button onclick="editar(${c.id})">
✏️
</button>

<button onclick="eliminar(${c.id})">
🗑️
</button>

</div>

`;

}

}

});

});

})

.catch(error => {

console.log("ERROR:", error);

});

}

// 🔥 ELIMINAR
function eliminar(id){

if(!confirm("¿Seguro que quieres eliminar?")) return;

fetch("http://localhost:3000/horarios/" + id, {

method: "DELETE"

})

.then(res => res.json())

.then(res => {

alert(res.mensaje);

cargarClases();

});

}

// 🔥 EDITAR
function editar(id){

const data = {

dia: prompt("Día:"),
hora: prompt("Hora:"),
materia: prompt("Materia:"),
grupo: prompt("Grupo:"),
carrera: prompt("Carrera:")

};

fetch("http://localhost:3000/horarios/" + id, {

method: "PUT",

headers: {

"Content-Type": "application/json"

},

body: JSON.stringify(data)

})

.then(res => res.json())

.then(res => {

alert(res.mensaje);

cargarClases();

});

}

// 🔥 MENÚ
function toggleMenu(){

let menu = document.getElementById("menuUsuario");

menu.style.display =
menu.style.display === "block"
? "none"
: "block";

}

// 🔥 CERRAR MENÚ
window.addEventListener("click", function(e){

if(!e.target.closest(".user-panel")){

document.getElementById("menuUsuario").style.display = "none";

}

});

// 🔥 CARGA INICIAL
window.onload = function(){

cargarClases();

};
const datosPerfil =
JSON.parse(localStorage.getItem("perfil_" + usuario.id));

if(datosPerfil){

document.getElementById("nombreDocenteSidebar").innerText =
datosPerfil.nombre || "Docente";

}

const fotoGuardada =
localStorage.getItem("fotoPerfil_" + usuario.id);

if(
fotoGuardada &&
fotoGuardada !== "null" &&
fotoGuardada !== "undefined"
){

document.getElementById("fotoDocenteSidebar").src =
fotoGuardada;

}
</script>
<a href="dashboard.html" class="btn-menu">
🏠 Menú
</a>
</body>
</html>
