<meta charset="UTF-8">

</head>

<body class="panel-body">


<!-- SIDEBAR -->

<div class="sidebar">

<div class="logo-panel">

<img src="img/tesji.png">

<h3>SISTEMA DE PLANEACIÓN ACADÉMICA</h3>

</div>

<div class="admin-info">

<div class="admin-info-box">

<img id="fotoAdminSidebar"
src="img/perfiles/default.png">

<p id="nombreAdmin">
Administrador
</p>

<span id="rolAdmin">
Administrador
</span>

</div>

</div>

<ul>

<li>
<a href="dashboard_admin.html">
🏠 Menú
</a>
</li>

<li>
<a href="planeaciones_admin.html">
📋 Planeaciones
</a>
</li>

<li class="active">
<a href="#">
👨‍🏫 Docentes
</a>
</li>

<li>
<a href="horarios_admin.html">
⏰ Horarios
</a>
</li>

<li>
<a href="grupos.html">
👥 Grupos
</a>
</li>

<li>
<a href="perfil_admin.html">
👤 Mi Perfil
</a>
</li>

<li>
<a href="#" onclick="cerrarSesion()">
🚪 Cerrar Sesión
</a>
</li>

</ul>

</div>

<!-- CONTENIDO -->

<div class="contenido">

<h1 class="titulo">
DOCENTES
</h1>

<input
type="text"
id="buscador"
placeholder="🔍 Buscar docente..."
onkeyup="filtrar()"
>

<table class="tabla tabla-docentes">

<thead>

<tr>
<th>Nombre</th>
<th>Carrera</th>
</tr>

</thead>

<tbody id="lista"></tbody>

</table>

</div>

<script>

const API = window.location.origin;


// ======================
// VALIDAR ADMIN
// ======================

const usuario = JSON.parse(localStorage.getItem("usuario"));


if (!usuario || usuario.tipo !== "administrador") {

    alert("⚠️ Acceso solo administrador");

    window.location = "login.html";

}


const adminId = usuario.id;



// ======================
// INICIAR PÁGINA
// ======================

function iniciarPagina(){


    // DATOS DEL ADMINISTRADOR

    const datos = JSON.parse(
        localStorage.getItem("perfil_admin_" + adminId)
    );


    if(datos){

        document.getElementById("nombreAdmin").innerHTML =
        datos.nombre || "Administrador";


        document.getElementById("rolAdmin").innerHTML =
        datos.rol || "Administrador";

    }



    // FOTO DEL ADMINISTRADOR

    const foto = localStorage.getItem(
        "foto_admin_" + adminId
    );


    const defaultFoto =
    "img/perfiles/default.png";


    document.getElementById("fotoAdminSidebar").src =
    foto || defaultFoto;



    cargarDocentes();

}
// ======================
// CARGAR DOCENTES
// ======================
function cargarDocentes() {

    fetch(`${API}/docentes`)
    .then(res => res.json())
    .then(data => {

        const tabla = document.getElementById("lista");

        tabla.innerHTML = "";

        data.forEach(d => {

            tabla.innerHTML += `
                <tr>
                    <td>${d.nombre}</td>
                    <td>${d.carrera || "Sin asignar"}</td>
                </tr>
            `;

        });

    })
    .catch(error => {
        console.log(error);
        alert("Error al cargar docentes.");
    });

}

// ======================
// BUSCADOR
// ======================
function filtrar() {

    const texto = document
        .getElementById("buscador")
        .value
        .toLowerCase();

    const filas = document.querySelectorAll("#lista tr");

    filas.forEach(fila => {

        fila.style.display =
            fila.innerText.toLowerCase().includes(texto)
            ? ""
            : "none";

    });

}

// ======================
// CERRAR SESIÓN
// ======================
function cerrarSesion() {

    localStorage.removeItem("usuario");

    window.location = "login.html";

}

// ======================
// INICIAR
// ======================
window.onload = iniciarPagina;

</script>
<a href="dashboard_admin.html" class="btn-menu">
🏠 Menú
</a>
</body>
</html>
