<div class="contenido">

<h1 class="titulo">Editar Perfil Administrador</h1>

<!-- PANEL -->
<div class="user-panel">

<img id="fotoUsuario" src="img/perfiles/default.png" class="user-icon" onclick="toggleMenu()">

<div id="menuUsuario" class="menu-usuario">
<a href="perfil_admin.html">👤 Ver perfil</a>
<a href="login.html">🚪 Cerrar sesión</a>
</div>

</div>

<div class="editar-perfil">

<!-- FOTO -->
<div class="foto-editar">

<img id="preview" src="img/perfiles/default.png">

<input type="file" id="inputFoto" style="display:none">

<button type="button" onclick="document.getElementById('inputFoto').click()">
Cambiar Foto
</button>

</div>

<!-- FORMULARIO MEJORADO -->
<form onsubmit="guardarAdmin(event)">

<input type="text" id="nombre" placeholder="Nombre">
<input type="email" id="correo" placeholder="Correo">
<input type="text" id="telefono" placeholder="Teléfono">

<input type="text" id="area" placeholder="Área (Ej: Control Escolar)">
<input type="text" id="matricula" placeholder="ID / Matrícula">

<select id="rol">
<option value="Seleccionar">Seleccionar</option>
<option value="Administrador">Administrador</option>
</select>


<button type="submit">Guardar</button>

</form>

</div>

</div>

<script>

const adminId = "admin";


// ============================
// CAMBIAR FOTO
// ============================

document.getElementById("inputFoto").addEventListener("change", function(e){

const file = e.target.files[0];

if(file){

const reader = new FileReader();

reader.onload = function(e){

const imagen = e.target.result;


// GUARDAR FOTO ADMINISTRADOR

localStorage.setItem(
"foto_admin_admin",
imagen
);


// ACTUALIZAR IMÁGENES

document.getElementById("preview").src = imagen;

document.getElementById("fotoUsuario").src = imagen;


};


reader.readAsDataURL(file);

}

});



// ============================
// GUARDAR PERFIL
// ============================

function guardarAdmin(e){

e.preventDefault();


const datos = {

nombre: document.getElementById("nombre").value,

correo: document.getElementById("correo").value,

telefono: document.getElementById("telefono").value,

area: document.getElementById("area").value,

matricula: document.getElementById("matricula").value,

rol: document.getElementById("rol").value

};


// GUARDAR PERFIL ADMIN

localStorage.setItem(
"perfil_admin_admin",
JSON.stringify(datos)
);



alert("Perfil actualizado correctamente ✅");


window.location = "perfil_admin.html";


}



// ============================
// CARGAR DATOS
// ============================

window.onload = function(){



const datos = JSON.parse(
localStorage.getItem("perfil_admin_admin")
);



if(datos){


nombre.value = datos.nombre || "";

correo.value = datos.correo || "";

telefono.value = datos.telefono || "";

area.value = datos.area || "";

matricula.value = datos.matricula || "";

rol.value = datos.rol || "Administrador";


}




// CARGAR FOTO

const foto = localStorage.getItem(
"foto_admin_admin"
);



if(foto){


preview.src = foto;

fotoUsuario.src = foto;


}


}



// ============================
// MENU USUARIO
// ============================

function toggleMenu(){

let menu = document.getElementById("menuUsuario");


menu.style.display = 
menu.style.display === "block" 
? "none" 
: "block";


}


</script>
<a href="dashboard_admin.html" class="btn-menu">
🏠 Menú
</a>
